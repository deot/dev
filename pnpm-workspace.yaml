linkWorkspacePackages: true
shamefullyHoist: true

packages:
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  canvas: true
  core-js: true
  esbuild: true
  puppeteer: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@deot/*'
  - '@vue/*'
  - 'vite'
  - 'vue-tsc'
  - '@puppeteer/*'
  - 'puppeteer'
  - 'puppeteer-core'
